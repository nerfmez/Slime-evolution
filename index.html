<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c39"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Slime — ฉากทดลองเว็บ</title><link rel="stylesheet" href="/style.css"></head><body>
<canvas id="world" aria-label="ฉากสามมิติ Slime"></canvas>
<header><div class="paper title"><small>SLIME · FIRE & SOULS</small><strong>ทุ่งหญ้า Slime</strong><span id="status">กำลังโหลดมอนด่าน 1…</span><progress id="health" value="100" max="100" aria-label="เลือดสไลม์"></progress><span id="health-text">HP 100 / 100</span><progress id="experience" max="6" value="0" aria-label="ประสบการณ์"></progress><span id="level-text">LV 1 · EXP 0 / 6</span><button id="retry" hidden>เริ่มใหม่</button></div><div class="right"><output id="stats" class="paper">— FPS</output><a href="/review/index.html" style="pointer-events:auto;padding:12px;background:#fff9e9;border-radius:12px;color:#303c35">ตรวจภาพเอฟเฟกต์</a><button id="settings" aria-expanded="false">ตั้งค่าทดลอง</button></div></header>
<aside id="panel" class="paper" hidden><div class="panelhead"><strong>ฉากทดสอบ</strong><button id="close" aria-label="ปิดตั้งค่า">×</button></div><label>มุมกล้อง<select id="camera"><option value="game">มุมเล่นเกม</option><option value="side">ด้านข้าง — ดูความตั้งตรง</option><option value="top">ด้านบน</option></select></label><label>Moss Frog · ภาพ 2D<select id="thorn-view"><option value="sprite" selected>2D · Frog moveset</option></select></label><label>เฟรมกบ<select id="thorn-frames"><option value="16" selected>16 เฟรม</option></select></label><a href="/review/thorn.html">ดูท่ากบ</a><a href="/review/slime.html">ลองสไลม์วาด 2D</a><p>มอนปกติช่อง Thorn ถูกแทนด้วย Moss Frog</p><label>จำนวนมอนสูงสุด<select id="mobs"><option value="0">0 ตัว</option><option value="12">12 ตัว</option><option value="40" selected>40 ตัว</option><option value="80">80 ตัว</option></select></label><label>กลุ่มมอน<select id="enemy-mode"><option value="auto">ทยอยตามเวลา</option><option value="all">ทดสอบครบ 4 ชนิด</option><option value="elites">Elite · Alpha ทั้ง 4</option><option value="boss">Boss · Ancient Bloom</option><option value="thorn">Moss Frog</option><option value="moss">Mossback</option><option value="petal">Petal Skitter</option><option value="crystal">Crystal Warden</option></select></label><label>เริ่มทดสอบที่<select id="start-minute"><option value="0">นาที 1</option><option value="60">นาที 2</option><option value="120">นาที 3</option><option value="180">นาที 4</option><option value="240">นาที 5</option><option value="295">ก่อนบอส 5 วิ</option></select></label><p id="roster"></p><button id="restart">เริ่มทดสอบใหม่</button><label>หญ้า<select id="grass"><option value="1200">1,200 กอ</option><option value="4000">4,000 กอ</option><option value="8000">8,000 กอ</option><option value="10000" selected>10,000 กอ</option></select></label><label>ความละเอียด<select id="quality"><option value="1">ประหยัด · 1×</option><option value="1.2" selected>ลื่นไหล · 1.2×</option><option value="1.5">สมดุล · 1.5×</option><option value="2">คมชัด · 2×</option></select></label><label>ความเร็ว<select id="speed"><option value="1">ปกติ</option><option value="0.25">ช้า ¼</option></select></label><label>ดูส่วนพายุ<select id="solo"><option value="all">รวมทุกส่วน</option><option value="fire">เฉพาะไฟ</option><option value="wind">เฉพาะริ้วลม</option></select></label><label class="check"><input id="loop" type="checkbox"> เล่นพายุซ้ำ</label><div class="row"><button id="pause">หยุดภาพ</button><button id="step">เดิน 1 เฟรม</button></div><button id="fullscreen">เต็มจอ</button><p>ค่าที่แสดงเป็น FPS ของเครื่องที่เปิดหน้านี้ ไม่ใช่ผลจากโทรศัพท์เครื่องอื่น</p></aside>
<div id="hint">ลากฝั่งซ้ายเพื่อเดิน · WASD / ปุ่มลูกศร</div><div id="joystick"><div id="knob"></div></div><output id="cast" aria-label="คูลดาวน์สกิลไฟ"></output><output id="fire-slot" class="paper"></output><canvas id="combat-feedback" aria-hidden="true"></canvas><div id="error" class="paper" hidden></div><script>addEventListener('pageshow',e=>{if(e.persisted)location.replace(location.pathname+'?frog=live6&ts='+Date.now())});</script><script type="module" src="/main.js?frog=live6"></script></body></html>
