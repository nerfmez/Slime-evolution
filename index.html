<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Slime · New Animals Only</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183429;color:#f2f0df;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#244836}.hud{position:fixed;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:3}.badge,.fps{background:rgba(238,236,211,.90);color:#244136;border:1px solid rgba(38,65,52,.22);box-shadow:0 5px 20px rgba(0,0,0,.18);border-radius:16px;padding:9px 12px;font-weight:800;backdrop-filter:blur(8px)}.badge small{display:block;font-size:10px;letter-spacing:.14em;opacity:.65}.badge strong{font-size:15px}.fps{font-variant-numeric:tabular-nums;min-width:82px;text-align:center}.panel{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:4;background:rgba(244,241,215,.93);color:#203c31;border:1px solid rgba(43,69,56,.22);box-shadow:0 8px 30px rgba(0,0,0,.28);border-radius:20px;padding:10px 12px 12px;backdrop-filter:blur(10px);touch-action:manipulation}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:8px}select,button{appearance:none;border:1px solid rgba(40,70,55,.28);background:#f8f3d9;color:#254536;border-radius:12px;padding:10px 12px;font:700 14px inherit;min-height:42px}select{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,#355946 50%),linear-gradient(135deg,#355946 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}button:active{transform:translateY(1px);background:#eee6bd}.grow{flex:1;min-width:180px}.state{flex:1;min-width:95px}.danger{background:#f5d7cc}.cast{background:#dcead2}.toggle{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.toggle input{width:20px;height:20px;accent-color:#345f49}.note{font-size:11px;opacity:.7;line-height:1.2;margin-left:auto}@media(max-width:720px){.panel{padding:8px}.row{gap:6px}select,button{font-size:12px;min-height:38px;padding:8px 10px}.badge strong{font-size:13px}.note{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="badge"><small>STANDALONE TEST</small><strong>NEW ANIMALS ONLY · ไม่มี legacy enemy script</strong></div><div id="fps" class="fps">-- FPS</div></div>
<div class="panel" id="panel"><div class="row"><select id="species" class="grow" aria-label="เลือกสัตว์"><option value="all">ดูทั้ง 5 ตัว</option><option value="frog">Moss Frog · Poison Tongue</option><option value="hedgehog">Spark Hedgehog · Lightning</option><option value="turtle">Pond Turtle · Guard</option><option value="calf">Water Calf · Water Shot</option><option value="panda">Forest Panda · Roll</option></select><label class="toggle"><input id="auto" type="checkbox" checked> วนอัตโนมัติ</label><select id="speed" aria-label="ความเร็ว"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></div><div class="row"><button class="state" data-act="walk">เดิน</button><button class="state" data-act="hit">โดนตี</button><button class="state cast" data-act="cast">ปล่อยสกิล</button><button class="state danger" data-act="dead">ตาย</button><button class="state" data-act="reset">รีเซ็ต</button><span class="note">ลากสไลม์บนฉากเพื่อดูการหัน/เล็งเป้า</span></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),speciesSel=document.getElementById('species'),autoBox=document.getElementById('auto'),speedSel=document.getElementById('speed'),fpsEl=document.getElementById('fps'),panel=document.getElementById('panel');let W=0,H=0,DPR=1,last=performance.now(),fpsAcc=0,fpsN=0,fpsT=0;const player={x:0,y:0,r:26},names={frog:'Moss Frog',hedgehog:'Spark Hedgehog',turtle:'Pond Turtle',calf:'Water Calf',panda:'Forest Panda'},colors={ink:'#2f3a31'};const animals=[];
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(!player.x){player.x=W*.5;player.y=H*.48}placeAnimals()}
function placeAnimals(){if(!animals.length)return;const cx=W*.5,cy=H*.43,rx=Math.min(W*.34,360),ry=Math.min(H*.25,180);animals.forEach((a,i)=>{const ang=-Math.PI*.85+i*(Math.PI*1.7/4);if(!a.userMoved){a.homeX=cx+Math.cos(ang)*rx;a.homeY=cy+Math.sin(ang)*ry;a.x=a.homeX;a.y=a.homeY}})}
function resetAnimal(a,i){a.x=a.homeX||W*.5;a.y=a.homeY||H*.5;a.vx=0;a.vy=0;a.state='walk';a.t=0;a.phase=i*.7;a.auto=1.5+i*.42;a.deadAge=0;a.hitFlash=0;a.userMoved=false}
['frog','hedgehog','turtle','calf','panda'].forEach((type,i)=>animals.push({type,x:0,y:0,homeX:0,homeY:0,state:'walk',t:0,phase:i*.7,auto:1.4+i*.5,deadAge:0,hitFlash:0,userMoved:false}));resize();animals.forEach(resetAnimal);
function targetAnimals(){const v=speciesSel.value;return v==='all'?animals:animals.filter(a=>a.type===v)}function setState(act){if(act==='reset'){targetAnimals().forEach((a,i)=>resetAnimal(a,i));return}targetAnimals().forEach(a=>{if(a.state==='dead'&&act!=='dead'){a.state='walk';a.deadAge=0}a.state=act;a.t=0;a.auto=2.3;if(act==='hit')a.hitFlash=1})}panel.addEventListener('pointerdown',e=>e.stopPropagation());panel.addEventListener('pointermove',e=>e.stopPropagation());document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>setState(b.dataset.act)));
let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);player.x=e.clientX;player.y=e.clientY});canvas.addEventListener('pointermove',e=>{if(dragging){player.x=e.clientX;player.y=e.clientY}});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
function ellipse(x,y,rx,ry,fill,stroke=colors.ink,lw=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}function line(points,stroke=colors.ink,lw=2){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}function poly(points,fill,stroke=colors.ink,lw=2){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}function eye(x,y){ellipse(x,y,3.5,4,'#19231d',null);ellipse(x+1,y-1.3,1,1,'#f7f4da',null)}function facing(a){return player.x>=a.x?1:-1}function shadow(a,scale=1){ctx.save();ctx.translate(a.x,a.y+26*scale);ctx.scale(1,.28);ellipse(0,0,30*scale,13*scale,'rgba(13,24,18,.28)',null);ctx.restore()}
function drawFrog(a,alpha=1){const f=facing(a),hop=a.state==='walk'?Math.max(0,Math.sin(a.phase*Math.PI*2))*12:0;ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y-hop);ctx.scale(f,1);ellipse(0,4,29,20,'#78975b');ellipse(-18,18,14,7,'#64834e');ellipse(18,18,14,7,'#64834e');ellipse(-14,-11,10,11,'#8cab67');ellipse(14,-11,10,11,'#8cab67');eye(-14,-12);eye(14,-12);line([[-8,7],[8,7]],'#455a42',1.8);poly([[-4,-22],[2,-32],[9,-23],[3,-18]],'#5f8650',colors.ink,1.4);ctx.restore();if(a.state==='cast'){const sx=a.x+f*20,sy=a.y-hop+5,tx=player.x,ty=player.y;line([[sx,sy],[tx,ty]],'#c86b78',7);line([[sx,sy],[tx,ty]],'#f0a4ad',2.5);for(let i=0;i<4;i++){const p=(i+1)/5;ellipse(sx+(tx-sx)*p,sy+(ty-sy)*p+Math.sin(a.t*10+i)*4,2.5,2.5,'#a45fb1',null)}}}
function drawHedgehog(a,alpha=1){const f=facing(a),bob=a.state==='walk'?Math.sin(a.phase*8)*2:0;ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y+bob);ctx.scale(f,1);for(let i=0;i<12;i++){const ang=Math.PI*.62+i*.16,x=Math.cos(ang)*30-8,y=Math.sin(ang)*25-7;line([[x,y],[Math.cos(ang)*43-9,Math.sin(ang)*37-9]],i%2?'#7a5b45':'#59493d',4)}ellipse(-4,2,28,21,'#b8865d');ellipse(17,3,17,15,'#e0b980');ellipse(-15,21,9,5,'#6c5547');ellipse(8,21,9,5,'#6c5547');eye(23,-2);line([[31,7],[38,5]],colors.ink,2);for(const [x,y] of [[-21,-28],[-2,-35],[17,-29]])poly([[x-4,y+7],[x,y-7],[x+3,y+2],[x+8,y-6],[x+5,y+8]],'#f0d24a',colors.ink,1.2);ctx.restore();if(a.state==='cast'){const pts=[[a.x,a.y-10]],seg=7;for(let i=1;i<seg;i++){const p=i/seg;pts.push([a.x+(player.x-a.x)*p+(i%2?8:-8),a.y-10+(player.y-a.y)*p+(i%2?-5:5)])}pts.push([player.x,player.y]);line(pts,'rgba(255,235,111,.45)',7);line(pts,'#ffe05a',2.8)}}
function drawTurtle(a,alpha=1){const f=facing(a),bob=a.state==='walk'?Math.sin(a.phase*5)*1.2:0;ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y+bob);ctx.scale(f,1);ellipse(-2,3,34,24,'#6f8e55');ellipse(-2,3,27,19,'#91ad68','#536c46',2);line([[-23,3],[20,3]],'#536c46',1.5);line([[-10,-14],[-8,19]],'#536c46',1.2);line([[7,-14],[9,18]],'#536c46',1.2);ellipse(-21,22,11,5,'#a9bd78');ellipse(10,22,11,5,'#a9bd78');ellipse(32,6,15,12,'#d1d99e');eye(38,2);ctx.restore();if(a.state==='cast'){const p=.55+.45*Math.sin(a.t*7);ctx.strokeStyle=`rgba(194,235,163,${.5+p*.35})`;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(a.x,a.y,47+p*8,35+p*5,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(85,143,71,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(a.x,a.y,58+p*9,43+p*6,0,0,Math.PI*2);ctx.stroke()}}
function drawCalf(a,alpha=1){const f=facing(a),bob=a.state==='walk'?Math.sin(a.phase*5.5)*2:0;ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y+bob);ctx.scale(f,1);ellipse(-4,3,34,24,'#839da3');ellipse(-20,24,8,11,'#6f8e94');ellipse(8,24,8,11,'#6f8e94');ellipse(25,-1,19,18,'#94aeb2');ellipse(15,-2,13,16,'#738f95');ellipse(35,-2,11,15,'#738f95');poly([[34,10],[45,15],[47,27],[43,39],[37,39],[40,28],[32,17]],'#94aeb2',colors.ink,2);eye(29,-6);poly([[-8,-23],[0,-34],[9,-24],[2,-19]],'#6d8b50',colors.ink,1.4);ctx.restore();if(a.state==='cast'){const sx=a.x+f*42,sy=a.y+20,tx=player.x,ty=player.y,wob=Math.sin(a.t*14)*5;line([[sx,sy],[tx,ty+wob]],'rgba(113,215,255,.35)',10);line([[sx,sy],[tx,ty+wob]],'#66c9ef',5);for(let i=0;i<6;i++){const p=(i+1)/7;ellipse(sx+(tx-sx)*p,sy+(ty+wob-sy)*p+Math.sin(i*2+a.t*10)*4,3.2,2.2,'#9ce4fa',null)}}}
function drawPanda(a,alpha=1){let rot=0,scale=1;if(a.state==='cast'){rot=a.t*8;scale=.94+Math.sin(a.t*14)*.04}const f=facing(a),bob=a.state==='walk'?Math.sin(a.phase*5)*1.8:0;ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y+bob);ctx.rotate(rot);ctx.scale(f*scale,scale);ellipse(-19,-21,9,9,'#373c38');ellipse(19,-21,9,9,'#373c38');ellipse(0,3,31,27,'#e7ddbd');ellipse(-13,-3,10,13,'#404641');ellipse(13,-3,10,13,'#404641');eye(-12,-3);eye(12,-3);ellipse(0,9,5,3,'#302f2c');ellipse(-28,23,12,7,'#404641');ellipse(28,23,12,7,'#404641');poly([[0,-25],[7,-35],[15,-26],[7,-20]],'#6a8f4f',colors.ink,1.4);ctx.restore();if(a.state==='cast'){ctx.strokeStyle='rgba(210,194,148,.65)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(a.x-38*f,a.y+4,22,-1.2,1.2);ctx.stroke()}}
const drawFns={frog:drawFrog,hedgehog:drawHedgehog,turtle:drawTurtle,calf:drawCalf,panda:drawPanda};function drawAnimal(a){const selected=speciesSel.value==='all'||speciesSel.value===a.type;let alpha=selected?1:.18;ctx.save();let shake=0;if(a.state==='hit')shake=Math.sin(a.t*55)*5;ctx.translate(shake,0);if(a.state==='dead'){const p=Math.min(1,a.deadAge/.45);ctx.translate(a.x,a.y);ctx.rotate(p*Math.PI*.45);ctx.translate(-a.x,-a.y);alpha*=1-Math.max(0,(a.deadAge-1.6)/.7)}drawFns[a.type](a,alpha);ctx.restore();if(a.state==='hit'&&a.hitFlash>0){ctx.save();ctx.globalAlpha=.18*a.hitFlash;ctx.fillStyle='#ff8d78';ctx.beginPath();ctx.arc(a.x,a.y,38,0,Math.PI*2);ctx.fill();ctx.restore()}if(selected){ctx.save();ctx.textAlign='center';ctx.font='700 12px system-ui';ctx.fillStyle='rgba(244,241,215,.9)';ctx.strokeStyle='rgba(22,40,31,.75)';ctx.lineWidth=3;const label=names[a.type]+' · '+({walk:'เดิน',hit:'โดนตี',cast:'ปล่อยสกิล',dead:'ตาย'}[a.state]||a.state);ctx.strokeText(label,a.x,a.y+56);ctx.fillText(label,a.x,a.y+56);ctx.restore()}}
function drawGround(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#315b43');g.addColorStop(1,'#1f4534');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.18;for(let y=80;y<H;y+=54)for(let x=(y%108?16:42);x<W;x+=52){const sway=Math.sin(t*1.2+x*.03+y*.02)*3;line([[x,y],[x+sway,y-12]],'#91aa70',1.4);line([[x+4,y],[x+8+sway,y-9]],'#728f5d',1.2)}ctx.globalAlpha=1;const r=Math.min(W,H)*.16,rg=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,r);rg.addColorStop(0,'rgba(111,174,151,.16)');rg.addColorStop(1,'rgba(111,174,151,0)');ctx.fillStyle=rg;ctx.fillRect(player.x-r,player.y-r,r*2,r*2)}function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ellipse(0,12,25,7,'rgba(12,24,18,.25)',null);ctx.beginPath();ctx.moveTo(-23,10);ctx.bezierCurveTo(-26,-8,-17,-25,0,-27);ctx.bezierCurveTo(17,-25,26,-8,23,10);ctx.bezierCurveTo(14,23,-14,23,-23,10);ctx.closePath();ctx.fillStyle='#65bde0';ctx.fill();ctx.strokeStyle='#2f4852';ctx.lineWidth=2.5;ctx.stroke();ellipse(-8,-5,3,4,'#16313a',null);ellipse(8,-5,3,4,'#16313a',null);ctx.restore()}
function updateAnimal(a,dt){a.t+=dt;a.phase+=dt*(a.type==='frog'?1.2:a.type==='turtle'?.55:.8);a.hitFlash=Math.max(0,a.hitFlash-dt*2.8);if(a.state==='dead'){a.deadAge+=dt;if(autoBox.checked&&a.deadAge>2.6)resetAnimal(a,animals.indexOf(a));return}if(a.state==='hit'&&a.t>.42){a.state='walk';a.t=0}if(a.state==='cast'&&a.t>1.15){a.state='walk';a.t=0}if(a.state==='walk'){const dx=a.homeX-a.x,dy=a.homeY-a.y,dist=Math.hypot(dx,dy);if(dist>2){const sp=a.type==='turtle'?12:a.type==='calf'?15:a.type==='frog'?18:16;a.x+=dx/dist*sp*dt;a.y+=dy/dist*sp*dt}a.x+=Math.sin(a.phase*.7+animals.indexOf(a))*2*dt;a.y+=Math.cos(a.phase*.6+animals.indexOf(a))*1.4*dt}if(autoBox.checked){a.auto-=dt;if(a.auto<=0&&a.state==='walk'){a.state='cast';a.t=0;a.auto=2.2+Math.random()*2.1}}}
function frame(now){const raw=Math.min(.05,(now-last)/1000||0);last=now;const speed=Number(speedSel.value)||1,dt=raw*speed;fpsAcc+=raw;fpsN++;fpsT+=raw;if(fpsT>.5){fpsEl.textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0;fpsT=0}drawGround(now/1000);animals.forEach(a=>updateAnimal(a,dt));animals.slice().sort((a,b)=>a.y-b.y).forEach(a=>{shadow(a,.9);drawAnimal(a)});drawPlayer();requestAnimationFrame(frame)}addEventListener('resize',resize,{passive:true});requestAnimationFrame(frame)
})();
</script>
</body></html>
