<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Slime · Exact Frog + Water Calf Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#203f32;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.tag{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:9px 12px;border-radius:14px;background:#f2eed8e8;color:#294639;font-weight:800;z-index:3}.tag small{display:block;font-size:10px;opacity:.65}.bar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;background:#f2eed8ee;color:#294639;border-radius:18px;padding:9px;display:flex;gap:7px;flex-wrap:wrap;box-shadow:0 8px 28px #0006}button,select{border:1px solid #345a4744;background:#fff9df;color:#294639;border-radius:11px;padding:9px 11px;font:700 13px system-ui;min-height:40px}button{flex:1}.bad{background:#f3d6cf}.cast{background:#d9ead3}.status{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));background:#f2eed8e8;color:#294639;border-radius:14px;padding:9px 12px;font-weight:700;z-index:3}</style></head><body><canvas id="c"></canvas><div class="tag"><small>EXACT ASSET TEST</small>กบเดิม + ช้างใหม่เท่านั้น</div><div class="status" id="status">กำลังโหลดกบเดิม…</div><div class="bar"><select id="who"><option value="both">ดูทั้งคู่</option><option value="frog">Moss Frog · ตัวเดิม</option><option value="calf">Water Calf · ตัวใหม่</option></select><button data-s="walk">เดิน</button><button data-s="hit">โดนตี</button><button class="cast" data-s="cast">ปล่อยสกิล</button><button class="bad" data-s="dead">ตาย</button><button data-s="auto">วนอัตโนมัติ</button></div><script>(()=>{'use strict';const C=document.querySelector('#c'),x=C.getContext('2d'),who=document.querySelector('#who'),st=document.querySelector('#status');let W,H,D=1,last=performance.now(),mode='auto',t=0;const frog=new Image();frog.crossOrigin='anonymous';frog.src='https://raw.githubusercontent.com/nerfmez/Slime-evolution/c1aebfc08a2130b3ab8bbde6d708ca6f8336ddee/published/2026-09-14/assets/enemies/frog-moveset.png';frog.onload=()=>st.textContent='กบเดิมโหลดแล้ว · Water Calf พร้อม';frog.onerror=()=>st.textContent='โหลด frog-moveset.png ไม่สำเร็จ';function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.s;t=0});function E(cx,cy,rx,ry,fill,stroke='#33413f',lw=2.4){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}function P(p,fill,stroke='#33413f',lw=2.1){x.beginPath();x.moveTo(...p[0]);for(let i=1;i<p.length;i++)x.lineTo(...p[i]);x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}function L(p,stroke='#33413f',lw=2.2){x.beginPath();x.moveTo(...p[0]);for(let i=1;i<p.length;i++)x.lineTo(...p[i]);x.strokeStyle=stroke;x.lineWidth=lw;x.lineCap='round';x.stroke()}function eye(cx,cy,closed=false){if(closed){L([[cx-5,cy],[cx+4,cy+1]],'#33413f',2.4);return}E(cx,cy,4.2,4.2,'#24302e',null);E(cx+1.2,cy-1.4,1.2,1.2,'#fff',null)}function drop(cx,cy,s=1){x.beginPath();x.moveTo(cx,cy-11*s);x.bezierCurveTo(cx-11*s,cy+2*s,cx-8*s,cy+12*s,cx,cy+13*s);x.bezierCurveTo(cx+8*s,cy+12*s,cx+11*s,cy+2*s,cx,cy-11*s);x.fillStyle='#55bfea';x.fill();x.strokeStyle='#33413f';x.lineWidth=1.6;x.stroke()}function calfFrame(f,cx,cy,scale=1){x.save();x.translate(cx,cy);x.scale(scale,scale);let px=-6,py=-34;if(f===1){px+=2;py-=3}if(f===2)py+=6;E(px,py+32,41,5,'#3c342b28',null);if(f===5){E(px-3,py+6,35,18,'#8faeb4');E(px+29,py+7,16,13,'#a8c0c3');E(px-23,py+20,10,6,'#73949b');E(px+5,py+21,10,6,'#73949b');L([[px+39,py+12],[px+48,py+22]],'#33413f',3);eye(px+32,py+6,true);P([[px-7,py-10],[px+1,py-20],[px+10,py-10],[px+3,py-5]],'#748f58','#33413f',1.6);x.restore();return}E(px-4,py,34,26,'#8faeb4');E(px-22,py+25,9,12,'#73949b');E(px+8,py+25,9,12,'#73949b');if(f===1){E(px-18,py+26,9,11,'#73949b');E(px+14,py+24,9,12,'#73949b')}E(px+27,py-3,20,20,'#a8c0c3');E(px+16,py-4,14,18,'#73949b');E(px+39,py-4,12,17,'#73949b');const tr=f>=3?[[px+39,py+7],[px+52,py+4],[px+61,py-4],[px+58,py-12],[px+52,py-9],[px+51,py],[px+35,py+16]]:[[px+38,py+7],[px+49,py+13],[px+50,py+29],[px+45,py+40],[px+39,py+39],[px+43,py+28],[px+35,py+17]];P(tr,'#a8c0c3');eye(px+32,py-7,f===2);P([[px-7,py-27],[px+1,py-38],[px+10,py-28],[px+3,py-23]],'#748f58','#33413f',1.7);if(f===2)L([[px+25,py-3],[px+37,py+2]],'#6f4d47',3);if(f===3)drop(px+65,py-12,.5);if(f===4){L([[px+60,py-7],[px+92,py-13],[px+116,py-10]],'#55bfea',6);drop(px+118,py-10,.42)}x.restore()}function stateAt(){if(mode!=='auto')return mode;const q=t%4.8;if(q<2.1)return'walk';if(q<2.65)return'hit';if(q<4)return'cast';return'dead'}function drawFrog(state,cx,cy){if(!frog.complete||!frog.naturalWidth)return;let sx=0,sy=0,sw=frog.naturalWidth/4,sh=frog.naturalHeight/4,dw=105,dh=105;if(state==='walk'){const rest=.22,hop=.46,cycle=rest+hop,p=t%cycle,cell=p<rest?0:Math.min(7,Math.floor(((p-rest)/hop)*8));sx=(cell%4)*sw;sy=Math.floor(cell/4)*sh;cy-=p<rest?0:Math.sin(Math.min(1,(p-rest)/hop)*Math.PI)*25}else if(state==='hit'){const cell=9;sx=(cell%4)*sw;sy=Math.floor(cell/4)*sh}else if(state==='dead'){const cell=8+Math.min(4,Math.floor((t%.5)/.1));sx=(cell%4)*sw;sy=Math.floor(cell/4)*sh}else{sx=sw;sy=sh*3;sw*=3;dw*=3}x.drawImage(frog,sx,sy,sw,sh,cx-dw/2,cy-dh/2,dw,dh)}function drawCalf(state,cx,cy){let f=0;if(state==='walk')f=Math.floor(t*4)%2;else if(state==='hit')f=2;else if(state==='cast')f=(Math.floor(t*5)%2)?4:3;else if(state==='dead')f=5;calfFrame(f,cx,cy,1.18)}function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;x.fillStyle='#244836';x.fillRect(0,0,W,H);for(let i=0;i<70;i++){const px=(i*97)%W,py=(i*53)%H;x.strokeStyle='#365f47';x.lineWidth=2;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.sin(i)*5,py-16);x.stroke()}const s=stateAt(),y=H*.48;if(who.value!=='calf'){E(W*.34,y+55,62,10,'#0004',null);drawFrog(s,W*.34,y)}if(who.value!=='frog'){E(W*.67,y+55,62,10,'#0004',null);drawCalf(s,W*.67,y)}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
