name: Import Stage 1 elites and boss
on:
  push:
    branches: ['feature/stage1-elites-boss']
    paths: ['.github/workflows/import-stage1-elites-boss.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage1-elites-boss
          fetch-depth: 0
      - name: Download prepared Stage 1 package
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://slime-evolution-recovery-0p2h7b.v2.appdeploy.ai/resources/Slime-stage1-elites-boss-github-import.zip' \
            -o /tmp/stage1-import.zip
          echo 'e8370dd322f09315009e8e2583f750e58372e11948d2bbf4db6361ac539adf2d  /tmp/stage1-import.zip' | sha256sum -c -
      - name: Import code and runtime assets
        run: |
          set -euo pipefail
          rm -rf /tmp/stage1-import
          mkdir -p /tmp/stage1-import
          unzip -q /tmp/stage1-import.zip -d /tmp/stage1-import
          test -f /tmp/stage1-import/public/assets/enemies/boss.bin
          test -f /tmp/stage1-import/public/assets/enemies/boss-spell.bin
          test -f /tmp/stage1-import/public/assets/enemies/petal-flight.bin
          test -f /tmp/stage1-import/public/assets/enemies/crystal-elite.png
          test -f /tmp/stage1-import/tests/stage1-elites-boss.test.mjs
          cp -a /tmp/stage1-import/. .
      - name: Validate Stage 1 port
        run: |
          set -euo pipefail
          node --check enemies.js
          node --check enemy-assets.js
          node --check fire-combat.js
          node --check main.js
          node --check shaders.js
          node --test tests/*.mjs
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'docs/STAGE1_SPECIALS_SOURCE.json').read_text())
          required=['boss.bin','boss-run.bin','boss-charge.bin','boss-push.bin','boss-spell.bin','boss.png','petal-flight.bin','crystal-elite.png']
          for name in required:
              p=root/'public/assets/enemies'/name
              assert p.exists() and p.stat().st_size>1000, name
          boss=json.loads((root/'public/assets/enemies/boss.json').read_text())
          assert boss['frames']==32 and set(boss['extra_clips'])=={'run','charge','push','spell'}
          petal=json.loads((root/'public/assets/enemies/petal.json').read_text())
          assert petal['flight_clip']['frames']==16
          crystal=json.loads((root/'public/assets/enemies/crystal.json').read_text())
          assert crystal['elite_texture']=='crystal-elite.png'
          print('validated', len(m['files']), 'enemy asset files')
          PY
      - name: Commit imported Stage 1 enemies
        run: |
          set -euo pipefail
          git config user.name 'Slime Stage1 import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/import-stage1-elites-boss.yml
          git add -A
          git status --short
          git commit -m 'Add Stage 1 Alpha elites and Ancient Bloom boss'
          git push origin HEAD:feature/stage1-elites-boss
