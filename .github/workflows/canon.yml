name: Locked Moss Frog canonical verification
on:
  push:
    branches: [main, fix/frog-canon-only]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frog-canon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Canonical game / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tree hashing and copy ONLY the locked complete game
        run: |
          node --test tests/canon.test.mjs
          npm run build
      - name: Install pinned browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run complete frog gameplay on strict static HTTP
        run: |
          set -euo pipefail
          node scripts/canon.mjs serve >/tmp/frog-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/release.json >/dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a node tests/frog-canon.mjs
      - name: Open ORIGINAL live domain and test actual frog gameplay
        env:
          SMOKE_URL: https://slime-evolution-five.vercel.app/
        run: xvfb-run -a node tests/frog-canon.mjs
      - name: Keep actual browser evidence even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frog-canon-runtime-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
      - name: Save full checked game package, not an HTML wrapper
        if: success() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: frog-canon-package
          path: dist/
          retention-days: 14
  audit-original-site:
    name: Read-only audit of ORIGINAL domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Compare every served canonical file with the preserved game
        run: npm run audit:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frog-canon-original-site-audit
          path: test-results/
          retention-days: 14
