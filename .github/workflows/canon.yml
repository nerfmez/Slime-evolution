name: Frog Water Boss regression
on:
  push:
    branches: [main, feature/water-calf-from-frog-canon]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_live:
        type: boolean
        default: false
        description: Compare candidate to ORIGINAL production URL only after deployment
permissions:
  contents: read
concurrency:
  group: water-calf-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Game regression / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact art, independent roster timings, shared files and numerical boss parity
        run: npm test && npm run build
      - name: Install pinned browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Frog, Water damage, boss, spawn modes and every skill preset on actual game
        run: |
          set -euo pipefail
          node scripts/canon.mjs serve >/tmp/game-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/release.json >/dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a node tests/frog-canon.mjs
          xvfb-run -a node tests/water-browser.mjs
          xvfb-run -a node tests/roster-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-species-proof-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && matrix.browser == 'chromium'
        with:
          name: three-species-tested-package
          path: dist/
          retention-days: 14
  audit-live:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm run audit:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-domain-candidate-audit
          path: test-results/
