name: Moss Frog safe validation
on:
  push:
    branches: [frog-safe-integration-20260915]
  pull_request:
    branches: [main]
    paths:
      - 'thorn-sprite.js'
      - 'public/assets/enemies/frog-moveset.png'
      - 'tests/frog-*'
      - '.github/workflows/frog-safe-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: npm install
      - name: Unit and regression tests
        run: |
          node --check thorn-sprite.js
          node --test tests/*.test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium verifier
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify rendered game and frog asset
        run: node tests/frog-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-frog-review
          path: /tmp/frog-review
          retention-days: 7
