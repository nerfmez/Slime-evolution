name: Fix Petal Alpha flight animation
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/fix-petal-flight-animation.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance the flight clip clock during Wing Dive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('enemies.js')
          s=p.read_text()
          old="if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=e.radius*1.90;e.animState='flight';return;}"
          new="if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=e.radius*1.90;e.anim=0;e.animState='flight';return;}"
          assert old in s, 'Petal swoop start anchor changed'
          s=s.replace(old,new,1)
          old2="if(e.skillDash>0){\n   const speed=e.skillKind==='vine_lunge'?8.8:e.skillKind==='petal_swoop'?e.speed*2:e.speed*2.35,step=speed*dt,dx=e.skillDirX*step,dz=e.skillDirZ*step;"
          new2="if(e.skillDash>0){\n   if(e.skillKind==='petal_swoop'){e.anim+=dt;e.walkBlend=1;e.animState='flight';}\n   const speed=e.skillKind==='vine_lunge'?8.8:e.skillKind==='petal_swoop'?e.speed*2:e.speed*2.35,step=speed*dt,dx=e.skillDirX*step,dz=e.skillDirZ*step;"
          assert old2 in s, 'Special dash anchor changed'
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('tests/stage1-elites-boss.test.mjs')
          s=p.read_text()
          old="assert.equal(e.flying,true);assert(e.skillDash>4);assert(e.grassRadius>e.radius);\n const c=new FireCombat(),before=e.hp;c.hit(e,10,0,0);assert.equal(before-e.hp,15);"
          new="assert.equal(e.flying,true);assert.equal(e.animState,'flight');assert(e.skillDash>4);assert(e.grassRadius>e.radius);\n const flightAnim=e.anim;w.update(.05,player,40);assert(e.anim>flightAnim,'flight animation clock must advance while Petal Alpha is diving');\n const c=new FireCombat(),before=e.hp;c.hit(e,10,0,0);assert.equal(before-e.hp,15);"
          assert old in s, 'Petal flight test anchor changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check enemies.js
          node --test tests/*.mjs
      - name: Commit fix
        run: |
          git config user.name 'Slime Petal fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-petal-flight-animation.yml
          git add -A
          git commit -m 'Fix Petal Alpha Wing Dive animation playback'
          git push origin HEAD:main
