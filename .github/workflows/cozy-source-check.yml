name: Cozy source verification
on:
  push:
    branches: [feature/cozy-10min-pacing]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package authoring and test files
        run: tar -czf /tmp/slime-source-support.tar.gz AGENTS.md CANON.json HANDOFF.md README.md package.json vercel.json baseline-manifest.json roster-parent-manifest.json docs scripts tests tools .github
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-source-support
          path: /tmp/slime-source-support.tar.gz
          retention-days: 3
