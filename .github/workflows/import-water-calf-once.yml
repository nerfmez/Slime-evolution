name: Import exact Water Calf change set once
on:
  push:
    branches: [feature/water-calf-from-frog-canon]
    paths: [.github/workflows/import-water-calf-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only supplied changes and verify their checksum
        env:
          TRANSFER_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-97a4-820b-890b-9c3aa86dfdf7/raw?se=2026-09-17T12%3A53%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=e4f7e098-ce40-5c2f-bcac-5dda4bb0b6b7&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T00%3A47%3A44Z&ske=2026-09-18T00%3A47%3A44Z&sks=b&skv=2026-02-06&sig=ULEzA2RBC0h2KPURSSeTmxGFf66wjXPMXcAfqQaJM1w%3D'
        run: |
          set -euo pipefail
          curl --fail --location --max-time 90 "$TRANSFER_URL" -o /tmp/water-change.zip
          echo '42d552bb9dca136a16346ce504a2a82ba8a85111b8fb1f15b7bcc221b945fb17  /tmp/water-change.zip' | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          c=json.loads(Path('CANON.json').read_text())
          assert c['tree']=='8290f60b6708eae7689ded9568264b70d5363eda','Wrong baseline'
          allowed=set('''art/elephant/hit.png
          art/elephant/walk.png
          art/elephant/provenance.json
          art/elephant/actions.png
          tools/patch-water-calf.py
          tools/pack-water-calf.py
          tests/water-calf.test.mjs
          tests/water-browser.mjs
          game/assets/water-calf.js
          game/assets/enemies/water-calf-atlas.json
          game/assets/enemies/water-calf-atlas.webp
          game/assets/main-critter-v4.js
          game/index.html
          docs/WATER-CALF.md
          docs/water-calf-reverse.json
          docs/water-calf-edits.json
          baseline-manifest.json'''.splitlines())
          with zipfile.ZipFile('/tmp/water-change.zip') as z:
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<14000000
              z.extractall('.')
          for f in ['crystal.bin','crystal.json','crystal.png','crystal-elite.png']:Path('game/assets/enemies',f).unlink()
          p=Path('tests/frog-canon.mjs');s=p.read_text();old=r'/thorn-sprite\.png|water-calf|elephant/i';assert old in s;s=s.replace(old,r'/thorn-sprite\.png|\/enemies\/crystal(?:\.|-elite)/i');s=s.replace('no obsolete normal Thorn sprite or elephant experiment requested','no obsolete normal Thorn sprite or Crystal model requested');p.write_text(s)
          p=Path('package.json');v=json.loads(p.read_text());v['scripts']['test']='node --test tests/*.test.mjs';p.write_text(json.dumps(v,indent=2)+'\n')
          p=Path('AGENTS.md');p.write_text('# Current candidate — Water Calf, 2026-09-17\n\nThe owner supplied three elephant PNGs and authorized continuing from the recovered Frog baseline. This branch changes ONLY Crystal -> Water Calf. Read docs/WATER-CALF.md and exact-byte regression tests. CANON.json pins the candidate tree and preserves baselineTree/baselineCommit separately. Do not reinstate the old root or abandoned elephant work. Do not call this branch deployed.\n\n## Historical recovery reference\n\n'+p.read_text())
          p=Path('HANDOFF.md');p.write_text('# Current Water Calf candidate\n\nRead docs/WATER-CALF.md. Two existing game files edited, four Crystal files removed, three runtime Water files added. Other 1,305 Frog game files are exact. Original PNGs: art/elephant. Production promotion is separate.\n\n## Recovery history\n\n'+p.read_text())
          PY
      - name: Pin and test candidate, preserving the original canon identity
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {treeHash} from './scripts/canon.mjs';
          const c=JSON.parse(await readFile('CANON.json','utf8'));
          c.name='Water Calf candidate on complete Moss Frog canon';
          c.baselineCommit=c.commit;c.baselineTree=c.tree;c.tree=await treeHash('game');
          c.kind='scoped-water-calf-candidate-not-yet-production';
          await writeFile('CANON.json',JSON.stringify(c,null,2)+'\n');
          console.log(c);
          JS
          npm test
          npm run build
      - name: Commit only game/art/docs/tests into candidate branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/water-calf-from-frog-canon'
          git add -- game art tools tests docs baseline-manifest.json CANON.json AGENTS.md HANDOFF.md package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace only Crystal using exact elephant art; preserve 1305 finished-Frog files'
          git push origin HEAD:feature/water-calf-from-frog-canon
          echo 'Candidate imported and byte/unit checked; browser verification is next. No main change or deployment.' >> "$GITHUB_STEP_SUMMARY"
