name: Critter pickup validation
on:
  push:
    branches: [feature/critter-pickups]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test critter feature when present
        run: |
          if [ -f tests/critter-pickups.test.mjs ]; then
            node --test tests/critter-pickups.test.mjs
          fi
      - name: Export text source for feature review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('/tmp/critter-source.zip', 'w', ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                      continue
                  if p.suffix in {'.js','.mjs','.html','.css','.md','.json','.yml'}:
                      z.write(p, str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: critter-source
          path: /tmp/critter-source.zip
          retention-days: 3
