name: Critter pickup validation
on:
  push:
    branches: [balance/glow-spawn-100]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize critters and test balance
        run: |
          python3 scripts/materialize-clean-atlas-v5.py
          node scripts/apply-critter-patch.mjs
          node --check published/2026-09-14/assets/main-critter-v4.js
          node --check published/2026-09-14/assets/critters-v4/renderer.js
          node --test tests/*.test.mjs
      - name: Install browser verifier
        run: |
          npm install --prefix /tmp/critter-browser --no-save playwright
          /tmp/critter-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual game rendering and touch input
        run: node tests/critter-browser.mjs
      - name: Save generated release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add critters tests/exp-sets.test.mjs tests/spawn-glow-balance.test.mjs tests/critter-browser.mjs docs/CRITTER_PICKUPS.md scripts/apply-critter-patch.mjs scripts/materialize-clean-atlas-v5.py AGENTS.md fire-combat.js vfx/beads.js published/2026-09-14/index.html published/2026-09-14/assets/main-critter-v4.js published/2026-09-14/assets/critters-v4
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize stronger glow and spawn balance'
            git push origin HEAD:balance/glow-spawn-100
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critter-review
          path: /tmp/critter-review
          retention-days: 7
