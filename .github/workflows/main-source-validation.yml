name: Source-first main validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build source
        run: |
          npm install
          npm run build
          test -s dist/index.html
          test -s dist/assets/enemies/water-calf-atlas.webp
          test ! -e dist/assets/enemies/crystal.bin
          test ! -e dist/assets/enemies/crystal.json
          test ! -e dist/assets/enemies/crystal.png
          test ! -e dist/assets/enemies/crystal-elite.png

      - name: Install Chromium verifier
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Boot built game and verify Water Calf runtime
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/slime-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_URL=http://127.0.0.1:4173/ node tests/source-smoke.mjs
