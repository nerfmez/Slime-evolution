name: Repair source-first VFX boot once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair canonical source VFX boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/vfx
          git show cf841e09ad37da59a8edb1911200d6a41979c5cc:published/2026-09-14/assets/vfx/inferno-flame-paint.png > public/assets/vfx/inferno-flame-paint.png
          python - <<'PY'
          from pathlib import Path

          path = Path('main.js')
          text = path.read_text()
          old = "fireVFX=createFireRenderer(gl,await loadTexture(gl,'./assets/vfx/inferno-flame-paint.png'),await loadTexture(gl,'./assets/vfx/inferno-atlas.png'),await loadTexture(gl,'./assets/vfx/inferno-inbetweens.png'),await loadTexture(gl,'./assets/vfx/inferno-inbetweens48.png'),await Promise.all(['sunfall-impact-hd.png','sunfall-flight-hd.png','sunfall-smoke-hd.png'].map(name=>loadTexture(gl,'./assets/vfx/'+name,false))));"
          new = "fireVFX=createFireRenderer(gl,await loadTexture(gl,'./assets/vfx/inferno-flame-paint.png'),null,null,null,[]);"
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new)
              path.write_text(text)
          elif count == 0 and new in text:
              pass
          else:
              raise SystemExit(f'unexpected VFX boot pattern count: {count}')
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          set -euo pipefail
          git add main.js public/assets/vfx/inferno-flame-paint.png
          if git diff --cached --quiet; then
            echo 'Source VFX boot already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make source-first VFX boot self-contained'
          git push origin HEAD:main
