name: Fix Petal Wing Dive homing and grass width
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/fix-petal-homing-grass.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Port source homing and grass corridor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('enemies.js'); s=p.read_text()

          old="function skillColor(kind){return SKILL_COLORS[kind]||[1,.78,.38];}"
          new="function skillColor(kind){return SKILL_COLORS[kind]||[1,.78,.38];}\nfunction petalSwoopGrassRadius(e){\n // Godot v100 main.gd: base monster radius -> 1.32 fast-motion widening -> 1.70 Wing Dive airflow, capped at 2.70.\n const sourceRadius=Math.min(2.70,clamp(.78+e.radius*.52,.90,1.85)*1.32*1.70);\n // grass-bend.js adds .36 to an actor's grassRadius, so store the core radius here.\n return Math.max(e.radius,sourceRadius-.36);\n}"
          if old not in s: raise SystemExit('skillColor anchor missing')
          s=s.replace(old,new,1)

          old="if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=e.radius*1.90;e.animState='flight';e.swoopTrailClock=0;e.swoopLastX=e.x;e.swoopLastZ=e.z;return;}"
          new="if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=petalSwoopGrassRadius(e);e.animState='flight';e.swoopTrailClock=0;e.swoopLastX=e.x;e.swoopLastZ=e.z;return;}"
          if old not in s: raise SystemExit('execute Wing Dive anchor missing')
          s=s.replace(old,new,1)

          old="if(e.skillKind==='petal_swoop'){e.anim+=dt;e.walkBlend=1;e.animState='flight';}\n   const speed=e.skillKind==='vine_lunge'?8.8:e.skillKind==='petal_swoop'?e.speed*2:e.speed*2.35,step=speed*dt,dx=e.skillDirX*step,dz=e.skillDirZ*step;\n   if(enemyCanStand(e.x+dx,e.z+dz,e.radius)){e.x+=dx;e.z+=dz;}else{e.skillDash=0;}"
          new="if(e.skillKind==='petal_swoop'){\n    // Godot v100 retargets WING DIVE every physics tick instead of locking the launch direction.\n    const sx=player[0]-e.x,sz=player[2]-e.z,sd=Math.hypot(sx,sz);if(sd>.000001){e.skillDirX=sx/sd;e.skillDirZ=sz/sd;}\n    e.anim+=dt;e.walkBlend=1;e.animState='flight';e.grassRadius=petalSwoopGrassRadius(e);\n   }\n   const speed=e.skillKind==='vine_lunge'?8.8:e.skillKind==='petal_swoop'?e.speed*2:e.speed*2.35,step=speed*dt,dx=e.skillDirX*step,dz=e.skillDirZ*step;\n   if(enemyCanStand(e.x+dx,e.z+dz,e.radius)){e.x+=dx;e.z+=dz;}else if(e.skillKind==='petal_swoop'){\n    // Godot move_and_slide keeps the five-second flight alive and slides along blockers.\n    let moved=false;if(enemyCanStand(e.x+dx,e.z,e.radius)){e.x+=dx;moved=true;}if(enemyCanStand(e.x,e.z+dz,e.radius)){e.z+=dz;moved=true;}\n   }else{e.skillDash=0;}"
          if old not in s: raise SystemExit('Wing Dive movement anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression assertions
        run: |
          cat >> tests/stage1-elites-boss.test.mjs <<'JS'

          test('Petal Alpha Wing Dive retargets a moving player and opens the source-width grass corridor',()=>{
           const w=world(),e=w.makeEnemy('petal',4,0,{elite:true});w.enemies=[e];e.skillCooldown=0;
           w.update(.05,player,40);for(let i=0;i<11;i++)w.update(.05,player,40);
           assert.equal(e.flying,true);assert(e.skillDash>4);
           const sourceVisibleRadius=e.grassRadius+.36;
           assert(sourceVisibleRadius>2.0&&sourceVisibleRadius<=2.70,'Wing Dive must widen grass to the Godot source-scale corridor');
           const movingPlayer=[0,0,4],beforeZ=e.z;w.update(.05,movingPlayer,40);
           assert(e.skillDirZ>.45,'Wing Dive must retarget toward the moving player every update');
           assert(e.z>beforeZ,'retargeted flight must actually move toward the new player position');
          });
          JS
      - name: Validate
        run: |
          set -euo pipefail
          node --check enemies.js
          node --test tests/*.mjs
          grep -q "petalSwoopGrassRadius" enemies.js
          grep -q "const sx=player\[0\]-e.x" enemies.js
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Slime Petal fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-petal-homing-grass.yml
          git add -A
          git commit -m 'Fix Petal Wing Dive homing and grass corridor'
          git push origin HEAD:main
