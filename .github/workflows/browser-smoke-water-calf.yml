name: Browser smoke test Water Calf preview

on:
  push:
    branches:
      - production-five-animals-fix
    paths:
      - '.github/workflows/browser-smoke-water-calf.yml'
      - 'BROWSER_SMOKE_TRIGGER'

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact static preview
        run: |
          python3 -m http.server 4173 --directory published/2026-09-14 >/tmp/slime-server.log 2>&1 &
          echo $! > /tmp/slime-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0 || sleep .2; done
          exit 1
      - name: Exercise Water Calf in Chromium/WebGL2
        run: |
          cat > smoke-water-calf.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          if(!response?.ok())throw new Error('index HTTP '+response?.status());
          await page.waitForTimeout(2500);
          let err=await page.locator('#error').evaluate(el=>({hidden:el.hidden,text:el.textContent}));
          if(!err.hidden)throw new Error('startup error: '+err.text);
          await page.click('#settings');
          await page.click('#tab-tools');
          await page.selectOption('#enemy-mode','calf');
          await page.click('#restart');
          await page.waitForTimeout(4200);
          err=await page.locator('#error').evaluate(el=>({hidden:el.hidden,text:el.textContent}));
          const roster=await page.locator('#roster').textContent();
          const status=await page.locator('#status').textContent();
          console.log('ROSTER:',roster);
          console.log('STATUS:',status);
          if(!err.hidden)throw new Error('Water Calf runtime error: '+err.text);
          if(!/Water Calf/.test(roster||''))throw new Error('Water Calf not active in test roster: '+roster);
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          NODE
          node smoke-water-calf.mjs
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/slime-server.pid) || true
