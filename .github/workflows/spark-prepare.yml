name: Prepare approved Spark Hedgehog integration
on:
  push:
    branches: [feature/spark-hedgehog-approved]
    paths: [.github/workflows/spark-prepare.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current authoring and regression files without touching game
        run: git archive HEAD -- AGENTS.md CANON.json HANDOFF.md README.md docs scripts tests tools package.json baseline-manifest.json roster-parent-manifest.json vercel.json .github > /tmp/spark-current-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: spark-current-source
          path: /tmp/spark-current-source.tar
          retention-days: 3
