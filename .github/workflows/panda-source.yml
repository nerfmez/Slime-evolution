name: Export current canonical Panda parent
on:
  push:
    branches: [feature/bamboo-panda-approved]
    paths: [.github/workflows/panda-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:game)" = '0ee1f341376fb02cddd04c899517ba6d8a097649'
          git archive HEAD | gzip -1 > /tmp/panda-parent.tar.gz
          test "$(stat -c%s /tmp/panda-parent.tar.gz)" -gt 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: panda-parent-source
          path: /tmp/panda-parent.tar.gz
          retention-days: 3
