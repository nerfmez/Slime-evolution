name: Build Water Calf preview on current production

on:
  push:
    branches:
      - production-five-animals-fix
    paths:
      - '.github/workflows/build-water-calf-preview.yml'
      - 'WATER_CALF_PREVIEW_TRIGGER'

permissions:
  contents: write

jobs:
  patch-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only Water Calf into the current production snapshot
        run: node tools/patch-production-water-calf.mjs
      - name: JavaScript syntax checks
        run: |
          node --check published/2026-09-14/assets/main-critter-v4.js
          node --check published/2026-09-14/assets/water-calf-v1.js
      - name: Static asset smoke test
        run: |
          python3 -m http.server 4173 --directory published/2026-09-14 >/tmp/slime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .2; done
          curl -fSs http://127.0.0.1:4173/ >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/main-critter-v4.js >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/water-calf-v1.js >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/grass-original.png >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/tree-reference-b.png >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/pond-painted.png >/dev/null
          curl -fSs http://127.0.0.1:4173/assets/vfx/inferno-flame-paint.png >/dev/null
          grep -q 'Water Calf · Water Shot' published/2026-09-14/index.html
          grep -q 'name: `Water Calf`' published/2026-09-14/assets/main-critter-v4.js
          grep -q 'kind: `water_shot`' published/2026-09-14/assets/main-critter-v4.js
      - name: Commit verified preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/2026-09-14/index.html published/2026-09-14/assets/main-critter-v4.js published/2026-09-14/assets/water-calf-v1.js
          if git diff --cached --quiet; then
            echo 'No preview changes to commit'
            exit 0
          fi
          git commit -m "Add Water Calf to current production preview [skip ci]"
          git push origin HEAD:production-five-animals-fix
