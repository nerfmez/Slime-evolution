name: Watercolor skill style
on:
  pull_request:
    paths:
      - 'vfx/watercolor-style.mjs'
      - 'scripts/canon.mjs'
      - 'CANON.json'
      - 'tests/watercolor-style.test.mjs'
      - 'tests/watercolor-browser.mjs'
      - '.github/workflows/watercolor-style.yml'
permissions:
  contents: read
jobs:
  watercolor-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium webkit
      - run: |
          node scripts/canon.mjs serve >/tmp/wc-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/release.json >/dev/null && break || sleep 1; done
          xvfb-run -a node tests/watercolor-browser.mjs && BROWSER=webkit xvfb-run -a node tests/watercolor-browser.mjs
