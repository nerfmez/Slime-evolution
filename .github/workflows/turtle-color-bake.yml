name: Bake reviewed Turtle walk palette
on:
  push:
    branches: [fix/turtle-walk-palette]
    paths: [.github/workflows/turtle-color-bake.yml]
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/turtle-walk-palette
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify untouched starting game and record exact parent manifest
        run: |
          test "$(git rev-parse HEAD:game)" = '326bd98cc2fa119152af79293bbb15b62e854fdf'
          node --input-type=module <<'JS'
          import {files} from './scripts/canon.mjs';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const m=[];for(const path of await files('game')){const b=await readFile('game/'+path);m.push({path,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});}
          if(m.length!==1260)throw Error('Wrong starting game');
          await writeFile('docs/turtle-color-parent-manifest.json',JSON.stringify(m,null,2)+'\n');
          JS
      - name: Bake the locally reviewed full-resolution RGB transform and verify every pixel
        run: |
          python -m pip install Pillow==11.3.0
          python tools/turtle_walk_color.py
          python tools/turtle_walk_color.py --check
      - name: Keep source extraction, documentation and browser proof consistent
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          replace('tools/prepare-turtle-assets.py','# Dark/green backgrounds and a matching-size full-state board for inspection.',
              "# Apply the reviewed palette after registration; no geometry/alpha changes.\nfrom turtle_walk_color import apply as apply_walk_color\napply_walk_color(R)\natlas=Image.open(O/'pond-turtle-atlas.webp').convert('RGBA')\ncells=[atlas.crop((i%4*CELL,i//4*CELL,(i%4+1)*CELL,(i//4+1)*CELL)) for i in range(16)]\n# Dark/green backgrounds and a matching-size full-state board for inspection.")
          replace('tests/turtle-browser.mjs',"import {mkdir,writeFile} from 'node:fs/promises';","import {mkdir,writeFile,readFile} from 'node:fs/promises';")
          replace('tests/turtle-browser.mjs','  return {width:im.width,height:im.height,clear,solid,borders,occupied};',
              "  const digest=async a=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',a)),b=>b.toString(16).padStart(2,'0')).join('');\n  const alpha=new Uint8Array(1536*1536),opaque=Array.from({length:16},()=>[]);\n  for(let y=0;y<1536;y++)for(let z=0;z<1536;z++){const j=(y*1536+z)*4;alpha[y*1536+z]=data[j+3];if(data[j+3]===255)opaque[Math.floor(y/384)*4+Math.floor(z/384)].push(data[j],data[j+1],data[j+2],255);}\n  const alphaSHA256=await digest(alpha),opaqueSHA256=await Promise.all(opaque.map(a=>digest(new Uint8Array(a))));\n  return {width:im.width,height:im.height,clear,solid,borders,occupied,alphaSHA256,opaqueSHA256};")
          replace('tests/turtle-browser.mjs',' assert.ok(atlas.occupied.slice(0,15).every(x=>x>5000));',
              " assert.ok(atlas.occupied.slice(0,15).every(x=>x>5000));\n const colorMetadata=JSON.parse(await readFile(new URL('../game/assets/enemies/pond-turtle-atlas.json',import.meta.url),'utf8')).walkColorMatch;\n assert.equal(atlas.alphaSHA256,colorMetadata.source.alphaSHA256,'Browser decoded alpha must remain unchanged');\n assert.deepEqual(atlas.opaqueSHA256,colorMetadata.output.cells.map(c=>c.opaqueRGBA_SHA256),'Every opaque sprite pixel must match the reviewed color bake');")
          replace('docs/POND-TURTLE.md','Walk saturation is corrected only by 1.045 to compensate for video encoding; no whole-character tint.',
              'The original 1.045 extraction adjustment is followed by the reviewed material-aware offline walk palette match in docs/TURTLE-WALK-COLOR.md; no whole-character tint.')
          p=Path('HANDOFF.md');p.write_text('# Current fix — Turtle walk palette (2026-09-18)\n\nRead docs/TURTLE-WALK-COLOR.md. Corrected RGB of the 12 actual registered walk cells; all alpha and still/effect cells are unchanged. No thumbnails or regenerated frames. Only atlas/metadata change at runtime; all 1258 other game files stay identical. Browser tests now compare decoded opaque pixels and alpha on local CI and the original production site. Run all existing regressions and confirm actual deployment before reporting live.\n\n## Previous handoff\n\n'+p.read_text())
          PY
          node --input-type=module <<'JS'
          import {treeHash} from './scripts/canon.mjs';
          import {readFile,writeFile} from 'node:fs/promises';
          const c=JSON.parse(await readFile('CANON.json','utf8'));
          c.previousCandidateTree=c.tree;c.tree=await treeHash('game');c.kind='scoped-turtle-walk-palette-match';
          await writeFile('CANON.json',JSON.stringify(c,null,2)+'\n');console.log(c.tree);
          JS
      - name: Run complete source integrity and state tests, then build the exact game
        run: npm test && npm run build
      - name: Commit the bounded color-only patch to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/enemies/pond-turtle-atlas.webp game/assets/enemies/pond-turtle-atlas.json CANON.json HANDOFF.md docs/POND-TURTLE.md docs/turtle-color-parent-manifest.json tools/prepare-turtle-assets.py tests/turtle-browser.mjs
          git commit -m 'Bake matched Turtle walk colors while preserving every pose, alpha and static sprite'
          git push origin HEAD:fix/turtle-walk-palette
      - name: Export the reviewed candidate source and atlas for independent inspection
        if: always()
        run: |
          mkdir -p test-results
          tar -cf test-results/turtle-color-source.tar AGENTS.md CANON.json HANDOFF.md docs tools tests scripts package.json .github game/assets/enemies/pond-turtle-atlas.webp game/assets/enemies/pond-turtle-atlas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turtle-color-bake-proof
          path: test-results/
          retention-days: 14
