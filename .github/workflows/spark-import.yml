name: Import and verify approved Spark Hedgehog
on:
  push:
    branches: [feature/spark-hedgehog-approved]
    paths: [.github/workflows/spark-import.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spark-hedgehog-approved
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the owner-approved bounded patch
        env:
          PATCH_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-af54-820b-8b11-3ab21ba92ba8/raw?se=2026-09-17T17%3A49%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=7571114c-adba-512a-aa75-667182d41c9f&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T01%3A21%3A45Z&ske=2026-09-18T01%3A21%3A45Z&sks=b&skv=2026-02-06&sig=mSWAEhBYsiuPIC6eK9Ur5osG91wSkvkITsmK/J%2BrA9s%3D'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:game)" = '8e9c7d28889efa8ba635caeba0be40960a8eb573'
          curl --fail --location --retry 2 "$PATCH_URL" -o /tmp/spark-patch.zip
          echo 'e09d29eb32b30740e21951c47c4089006c509441b647944b29db329000b565c8  /tmp/spark-patch.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib
          with zipfile.ZipFile('/tmp/spark-patch.zip') as z:
              m=json.loads(z.read('TRANSFER-MANIFEST.json'))
              assert len(m['files'])==24
              assert set(z.namelist())==set(m['files'])|{'TRANSFER-MANIFEST.json'}
              for name,expected in m['files'].items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and not any(c.startswith('.') for c in p.parts)
                  assert p.parts[0] in ['game','art','docs','tests','tools','AGENTS.md','CANON.json','HANDOFF.md']
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==expected,name
                  dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          PY
      - name: Verify all preserved bytes, state logic, source artwork and candidate tree
        run: npm test && npm run build
      - name: Commit assets and scoped integration to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CANON.json HANDOFF.md art/spark docs/SPARK-HEDGEHOG.md docs/spark-integration-proof.json game tests tools/prepare-spark-assets.py
          git commit -m 'Add approved Spark Hedgehog sprites with aligned poses and impact-timed melee'
          git push origin HEAD:feature/spark-hedgehog-approved
      - name: Install same pinned browser verifier as canonical regression
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium webkit
      - name: Test Spark and all existing creatures, attacks, menus and skills on actual game
        run: |
          set -euo pipefail
          node scripts/canon.mjs serve >/tmp/game-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/release.json >/dev/null; then break; fi
            sleep 1
          done
          for browser in chromium webkit; do
            BROWSER=$browser xvfb-run -a node tests/spark-browser.mjs
            BROWSER=$browser xvfb-run -a node tests/frog-canon.mjs
            BROWSER=$browser xvfb-run -a node tests/water-browser.mjs
            BROWSER=$browser xvfb-run -a node tests/roster-browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-integration-proof
          path: test-results/
          retention-days: 14
