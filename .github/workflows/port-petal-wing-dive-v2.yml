name: Port complete Petal Alpha Wing Dive v2
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/port-petal-wing-dive-v2.yml']
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Port Godot Wing Dive pose state and trail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('enemies.js'); s=p.read_text()
          pairs=[
          ("grassRadius:s.radius,recovery:0,bossCycle:0,animState:'walk'};","grassRadius:s.radius,recovery:0,bossCycle:0,animState:'walk',swoopTrailClock:0,swoopLastX:x,swoopLastZ:z};"),
          ("e.skillColor=skillColor(kind);e.animState=e.isBoss?(kind==='vine_lunge'?'charge':kind==='root_slam'?'push':'spell'):'walk';\n  const cooldown=","e.skillColor=skillColor(kind);e.animState=e.isBoss?(kind==='vine_lunge'?'charge':kind==='root_slam'?'push':'spell'):'walk';\n  if(kind==='petal_swoop'){e.flying=true;e.anim=0;e.animState='flight';e.swoopTrailClock=0;e.swoopLastX=e.x;e.swoopLastZ=e.z;}\n  const cooldown="),
          ("if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=e.radius*1.90;e.anim=0;e.animState='flight';return;}","if(kind==='petal_swoop'){e.skillDash=5.0;e.flying=true;e.grassRadius=e.radius*1.90;e.animState='flight';e.swoopTrailClock=0;e.swoopLastX=e.x;e.swoopLastZ=e.z;return;}"),
          (" finishDash(e){\n"," emitPetalSwoopTrail(e){\n  const moved=Math.hypot(e.x-e.swoopLastX,e.z-e.swoopLastZ);e.swoopTrailClock-=this._lastDt||0;\n  if(e.swoopTrailClock>0&&moved<.10)return;\n  if(moved>.015)this.effects.push({kind:'petal_swoop_trail',x:(e.swoopLastX+e.x)*.5,z:(e.swoopLastZ+e.z)*.5,x0:e.swoopLastX,z0:e.swoopLastZ,x1:e.x,z1:e.z,r:Math.max(.36,moved),color:e.skillColor,age:0,life:.34});\n  e.swoopLastX=e.x;e.swoopLastZ=e.z;e.swoopTrailClock=.085;\n }\n finishDash(e){\n"),
          ("if(e.skillWindup>0){e.skillWindup=Math.max(0,e.skillWindup-dt);if(e.skillWindup<=0)this.executeSkill(e);return true;}","if(e.skillWindup>0){if(e.skillKind==='petal_swoop'){e.flying=true;e.animState='flight';e.anim+=dt;e.walkBlend=1;}e.skillWindup=Math.max(0,e.skillWindup-dt);if(e.skillWindup<=0)this.executeSkill(e);return true;}"),
          ("if(enemyCanStand(e.x+dx,e.z+dz,e.radius)){e.x+=dx;e.z+=dz;}else{e.skillDash=0;}\n   e.yaw=","if(enemyCanStand(e.x+dx,e.z+dz,e.radius)){e.x+=dx;e.z+=dz;}else{e.skillDash=0;}\n   if(e.skillKind==='petal_swoop')this.emitPetalSwoopTrail(e);\n   e.yaw="),
          ("if(e.skillKind==='petal_swoop'){e.flying=false;e.grassRadius=e.radius;}","if(e.skillKind==='petal_swoop'){e.flying=false;e.grassRadius=e.radius;e.swoopTrailClock=0;}"),
          ("if(dt<=0||this.hp<=0||this.finished)return;dt=Math.min(dt,.05);this.player=player;","if(dt<=0||this.hp<=0||this.finished)return;dt=Math.min(dt,.05);this._lastDt=dt;this.player=player;")]
          for old,new in pairs:
              if old not in s: raise SystemExit('enemies anchor missing: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('main.js'); s=p.read_text()
          pairs=[
          ("const texture=e.isElite&&asset.eliteTex?asset.eliteTex:asset.tex,scale=e.scale||1,y=e.flying?.55:.015;\n  drawModel(asset,model(e.x,y,e.z,scale,scale,scale,e.yaw),0,texture);","const texture=e.isElite&&asset.eliteTex?asset.eliteTex:asset.tex,flightPulse=e.flying?1.05+Math.sin(e.anim*46)*.045:1,scale=(e.scale||1)*flightPulse,y=e.flying?(e.skillWindup>0?.36:.55):.015;\n  drawModel(asset,model(e.x,y,e.z,scale,scale,scale,e.yaw),0,texture);"),
          ("for(const fx of enemyWorld.effects)if(tileVisible(fx.x,fx.z,fx.r+.5)){uniform(gl,prog,'enemySkillColor',fx.color||[1,.78,.38]);draw(quad,31,model(fx.x,.04,fx.z,fx.r,1,fx.r),Math.max(0,Math.min(1,fx.life/.42)));}","for(const fx of enemyWorld.effects)if(tileVisible(fx.x,fx.z,fx.r+.5)){uniform(gl,prog,'enemySkillColor',fx.color||[1,.78,.38]);if(fx.kind==='petal_swoop_trail'){const dx=fx.x1-fx.x0,dz=fx.z1-fx.z0,len=Math.max(.16,Math.hypot(dx,dz)),yaw=Math.atan2(dx,dz);draw(quad,34,model(fx.x,.14,fx.z,.24,1,len*.72,yaw),Math.max(0,Math.min(1,fx.life/.34)));}else draw(quad,31,model(fx.x,.04,fx.z,fx.r,1,fx.r),Math.max(0,Math.min(1,fx.life/.42)));}")]
          for old,new in pairs:
              if old not in s: raise SystemExit('main anchor missing: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('shaders.js'); s=p.read_text()
          old="else if(kind==33.){float r=length(vUV*2.-1.);alpha=(1.-smoothstep(.025,.11,abs(r-.78)))*fade*.8;c=enemySkillColor;}\nelse if(kind==27.){"
          new="else if(kind==33.){float r=length(vUV*2.-1.);alpha=(1.-smoothstep(.025,.11,abs(r-.78)))*fade*.8;c=enemySkillColor;}\nelse if(kind==34.){vec2 q=vUV*2.-1.;float along=vUV.y;float bend=.12*sin(along*8.+time*11.);float outer=1.-smoothstep(.16,.34,abs(q.x-bend));float core=1.-smoothstep(.035,.15,abs(q.x+bend*.35));float bars=0.;for(int i=0;i<3;i++){float p=.30+float(i)*.22;float by=1.-smoothstep(.025,.075,abs(along-p));float bx=1.-smoothstep(.20,.72,abs(q.x));bars=max(bars,by*bx);}float taper=smoothstep(0.,.10,along)*(1.-smoothstep(.86,1.,along));c=mix(enemySkillColor*1.05,vec3(1.,.965,.85),max(core,bars*.82));alpha=max(outer*.62,core*.90);alpha=max(alpha,bars*.58);alpha*=taper*fade;if(alpha<.02)discard;}\nelse if(kind==27.){"
          if old not in s: raise SystemExit('shader anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate behavior and rendering source
        run: |
          node --check enemies.js
          node --check main.js
          node --check shaders.js
          node --test tests/*.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {EnemyWorld} from './enemies.js';
          const player=[0,0,0],w=new EnemyWorld();w.initial=false;w.rebuild(player);const e=w.makeEnemy('petal',4,0,{elite:true});w.enemies=[e];e.skillCooldown=0;
          w.update(.05,player,40);assert.equal(e.skillKind,'petal_swoop');assert.equal(e.flying,true);assert.equal(e.animState,'flight');const a=e.anim;w.update(.05,player,40);assert(e.anim>a);
          for(let i=0;i<10;i++)w.update(.05,player,40);assert(e.skillDash>4);for(let i=0;i<6;i++)w.update(.05,player,40);assert(w.effects.some(f=>f.kind==='petal_swoop_trail'));
          console.log('PASS: Wing Dive uses flight pose during windup/dash and emits 0.085s source-style trail segments');
          JS
          grep -q "kind==34" shaders.js
          grep -q "asset.clips?.flight" main.js
      - name: Commit complete Wing Dive port
        run: |
          git config user.name 'Slime Petal port'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/port-petal-wing-dive.yml .github/workflows/port-petal-wing-dive-v2.yml
          git add -A
          git commit -m 'Port source-accurate Petal Alpha Wing Dive and trail VFX'
          git push origin HEAD:main
