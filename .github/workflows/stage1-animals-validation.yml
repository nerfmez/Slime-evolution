name: Stage 1 five-animal validation
on:
  push:
    branches: [stage1-five-animals-20260916]
  pull_request:
    branches: [main]
    paths:
      - 'stage1-animals.js'
      - 'public/assets/enemies/stage1-animals.svg'
      - 'scripts/stage1-enemies.template.js'
      - 'scripts/apply-stage1-animals.mjs'
      - 'tests/stage1-five-animals.test.mjs'
      - 'tests/stage1-animal-behavior.test.mjs'
      - 'enemies.js'
      - 'main.js'
      - 'fire-combat.js'
      - 'gl.js'
      - 'index.html'
      - '.github/workflows/stage1-animals-validation.yml'
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: npm install
      - name: Materialize five-animal Stage 1
        run: node scripts/apply-stage1-animals.mjs
      - name: Syntax, animation wiring, and animal behavior tests
        run: |
          node --check enemies.js
          node --check stage1-animals.js
          node --check main.js
          node --check fire-combat.js
          node --check gl.js
          node --test tests/stage1-five-animals.test.mjs tests/stage1-animal-behavior.test.mjs
      - name: Build game
        run: npm run build
      - name: Save reviewable published build
        if: github.event_name == 'push'
        run: |
          rm -rf published/2026-09-16
          mkdir -p published/2026-09-16
          cp -R dist/. published/2026-09-16/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enemies.js main.js fire-combat.js gl.js index.html HANDOFF.md stage1-animals.js public/assets/enemies/stage1-animals.svg scripts/stage1-enemies.template.js scripts/apply-stage1-animals.mjs tests/stage1-five-animals.test.mjs tests/stage1-animal-behavior.test.mjs published/2026-09-16
          if git diff --cached --quiet; then
            echo 'Five-animal Stage 1 already materialized.'
            exit 0
          fi
          git commit -m 'Materialize five-animal Stage 1 ecosystem'
          git push origin HEAD:stage1-five-animals-20260916
