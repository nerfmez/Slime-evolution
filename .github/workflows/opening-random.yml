name: Opening skill randomness
on:
  pull_request:
    paths:
      - 'gameplay/opening-random.mjs'
      - 'scripts/canon.mjs'
      - 'CANON.json'
      - 'tests/opening-random.test.mjs'
      - 'tests/opening-random-browser.mjs'
      - '.github/workflows/opening-random.yml'
permissions:
  contents: read
jobs:
  opening-random:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium
      - run: |
          node scripts/canon.mjs serve >/tmp/opening-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/release.json >/dev/null && break || sleep 1; done
          xvfb-run -a node tests/opening-random-browser.mjs
