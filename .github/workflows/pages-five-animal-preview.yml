name: Five-animal playable preview
on:
  push:
    branches: [main]
    paths:
      - 'published/2026-09-16/**'
      - '.github/workflows/pages-five-animal-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published/2026-09-16
      - name: Deploy playable preview
        id: deployment
        uses: actions/deploy-pages@v4
