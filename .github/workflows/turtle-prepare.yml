name: Prepare Pond Turtle source
on:
  push:
    branches: [feature/pond-turtle-approved]
    paths: [.github/workflows/turtle-prepare.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export only the current repository source tree
        run: |
          test "$(git rev-parse HEAD:game)" = '28af42874d11c618a130db9fb9c1800d1a77b53a'
          git archive --format=tar HEAD > /tmp/turtle-latest-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: turtle-latest-source
          path: /tmp/turtle-latest-source.tar
          retention-days: 3
