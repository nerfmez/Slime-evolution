name: Format production bundle for patching

on:
  push:
    branches:
      - production-five-animals-fix
    paths:
      - 'FORMAT_PROD_TRIGGER'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format current production bundle
        run: |
          mkdir -p debug-prod
          npx --yes prettier@3.3.3 published/2026-09-14/assets/main-critter-v4.js --parser babel > debug-prod/main-critter-v4.formatted.js
      - name: Commit formatted bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug-prod/main-critter-v4.formatted.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format current production bundle for patching [skip ci]"
          git push origin HEAD:production-five-animals-fix
