name: Import approved Pond Turtle patch
on:
  push:
    branches: [feature/pond-turtle-approved]
    paths: [.github/workflows/turtle-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pond-turtle-approved
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import only bounded, checksum-verified project files
        env:
          PATCH_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-c6e8-8230-a0c2-c20a9d09e317/raw?se=2026-09-18T05%3A07%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=29505676-ce3a-5995-8967-8f5b1f3621fe&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T00%3A15%3A42Z&ske=2026-09-19T00%3A15%3A42Z&sks=b&skv=2026-02-06&sig=id2Gzm5dyYYdaHTtMWtqophcqO/hT0yMw/0igHESFh0%3D'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:game)" = '28af42874d11c618a130db9fb9c1800d1a77b53a'
          curl --fail --location --retry 2 "$PATCH_URL" -o /tmp/turtle-patch.zip
          echo '800de575191d9bec9e88c25a7cd603d9ce67e916723870a9d144e3cda7e2e97d  /tmp/turtle-patch.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib,subprocess
          with zipfile.ZipFile('/tmp/turtle-patch.zip') as z:
              m=json.loads(z.read('TRANSFER-MANIFEST.json'))
              assert len(m['files'])==27 and m['candidateTree']=='326bd98cc2fa119152af79293bbb15b62e854fdf'
              assert set(z.namelist())==set(m['files'])|{'TRANSFER-MANIFEST.json'}
              paths=[]
              for name,expected in m['files'].items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==expected,name
                  if p.parts[0]=='.github':
                      assert name in ['.github/workflows/canon.yml','.github/workflows/verify-production.yml']
                      continue
                  assert not any(part.startswith('.') for part in p.parts)
                  assert p.parts[0] in ['game','art','docs','tests','tools','AGENTS.md','CANON.json','HANDOFF.md']
                  dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data);paths.append(name)
              subprocess.run(['git','add','--',*paths],check=True)
          PY
      - name: Verify canonical bytes and all unit and preservation tests
        run: npm test && npm run build
      - name: Commit scoped Turtle implementation to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Pond Turtle from real video frames with self-only Shell Guard and original shell death'
          git push origin HEAD:feature/pond-turtle-approved
