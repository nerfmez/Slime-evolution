name: One-shot replace clean Moss Frog atlas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate cleaned atlas
        run: |
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1UYV75khqxw8vmclFPiw2zWffrQJ71Ldi&export=download&confirm=t' -o /tmp/frog.png
          test "$(stat -c%s /tmp/frog.png)" = '302912'
          test "$(xxd -p -l 8 /tmp/frog.png)" = '89504e470d0a1a0a'
          test "$(xxd -p -s 16 -l 8 /tmp/frog.png)" = '0000020000000200'
      - name: Replace only runtime atlas copies
        run: |
          cp /tmp/frog.png public/assets/enemies/frog-moveset.png
          cp /tmp/frog.png published/2026-09-14/assets/enemies/frog-moveset.png
      - name: Commit atlas only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/enemies/frog-moveset.png published/2026-09-14/assets/enemies/frog-moveset.png
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Moss Frog atlas with clean transparent version'
          git push origin HEAD:main
