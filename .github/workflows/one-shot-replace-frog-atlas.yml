name: One-shot replace clean Moss Frog atlas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate cleaned atlas
        run: |
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1UYV75khqxw8vmclFPiw2zWffrQJ71Ldi' -o /tmp/frog.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/frog.png').convert('RGBA')
          assert im.size==(512,512), im.size
          alpha=im.getchannel('A')
          assert alpha.getextrema()[0] == 0, alpha.getextrema()
          assert sum(1 for a in alpha.getdata() if a==0) > 50000
          print('validated', im.size, alpha.getextrema())
          PY
      - name: Replace only runtime atlas copies
        run: |
          cp /tmp/frog.png public/assets/enemies/frog-moveset.png
          cp /tmp/frog.png published/2026-09-14/assets/enemies/frog-moveset.png
      - name: Commit atlas only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/enemies/frog-moveset.png published/2026-09-14/assets/enemies/frog-moveset.png
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Moss Frog atlas with clean transparent version'
          git push origin HEAD:main
