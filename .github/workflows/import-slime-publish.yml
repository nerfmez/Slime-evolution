name: Import Slime ready-to-publish ZIP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-slime-publish.yml
      - tools/import_slime_publish.py
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing Slime-ready-to-publish.zip
        required: true
        default: web-2026-09-14
        type: string

permissions:
  contents: read

concurrency:
  group: slime-ready-build-import
  cancel-in-progress: false

jobs:
  validate-importer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check importer syntax
        run: python3 -m py_compile tools/import_slime_publish.py
      - name: Explain setup-only run
        if: github.event_name == 'push'
        run: echo 'Importer installed. The game ZIP has NOT been uploaded or imported yet.' >> "$GITHUB_STEP_SUMMARY"

  import-build:
    needs: validate-importer
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.tag_name == 'web-2026-09-14')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the exact attached release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slime-publish"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Slime-ready-to-publish.zip' --dir "$RUNNER_TEMP/slime-publish"
      - name: Verify SHA-256 and import without replacing source
        run: python3 tools/import_slime_publish.py "$RUNNER_TEMP/slime-publish/Slime-ready-to-publish.zip"
      - name: Commit only the imported build
        run: |
          set -euo pipefail
          git add --force -- published/2026-09-14
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import verified ready-to-publish Slime build from 2026-09-14'
          git push origin HEAD:main
          echo 'Imported and checksum-verified 1,278 files into published/2026-09-14. Existing source is unchanged. Hosting has NOT been deployed.' >> "$GITHUB_STEP_SUMMARY"
