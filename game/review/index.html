<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจภาพเอฟเฟกต์ — Slime</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeadc;color:#303c35;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}header,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:24px}button,select,a{font:inherit;padding:12px;border:1px solid #a2ac99;border-radius:10px;background:#fffdf4;color:inherit;cursor:pointer}p{line-height:1.6}.stage{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}figure{margin:0}img{width:100%;height:auto;border-radius:12px;display:block}figcaption{padding:8px 0}input[type=range]{width:100%;min-height:42px}#poses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}#poses button{padding:2px;font-size:12px}output{font-variant-numeric:tabular-nums}@media(max-width:680px){.stage{grid-template-columns:1fr}#poses{grid-template-columns:repeat(3,1fr)}}button:focus-visible,a:focus-visible{outline:3px solid #c8772f}</style>
<main><header><h1>ตรวจภาพเอฟเฟกต์</h1><a href="/">กลับเกม</a></header><p>ภาพที่เรนเดอร์ไว้แล้ว · เปิดดูได้โดยไม่ต้องเปิดฉากเกม</p><label>ชุดภาพ <select id="set" aria-label="ชุดภาพ"></select></label><p id="note">ภาพแยกเอฟเฟกต์ ใช้ความชันกล้องเกมและซูมเพื่อดูรายละเอียด ยังไม่ใช่ภาพเต็มฉากจากเครื่องผู้เล่น</p><div class="stage"><figure><img id="frame" alt="เฟรมเอฟเฟกต์สกิล"><figcaption><output id="time"></output></figcaption></figure><figure><img id="target" src="target.png" alt="ภาพอ้างอิงของสกิลที่เลือก"><figcaption id="reference-label">ภาพอ้างอิง</figcaption></figure></div><div class="controls"><button id="prev">ก่อนหน้า 1 เฟรม</button><button id="play">เล่น</button><button id="next">ถัดไป 1 เฟรม</button><label>ความเร็ว <select id="speed"><option value="1">ปกติ</option><option value="0.25">ช้า ¼</option></select></label></div><input id="scrub" aria-label="เลื่อนเฟรม" type="range" min="0" value="0" step="1"><div id="poses"></div><p id="status" role="status">กำลังโหลดภาพ…</p></main>
<script>
const $=id=>document.getElementById(id);let sets=[],current,index=0,timer=null;
const frameTime=n=>current.times?.[n]??n/current.fps;
function stop(){clearTimeout(timer);timer=null;$('play').textContent='เล่น'}
function show(n){index=Math.max(0,Math.min(current.frames.length-1,n));$('frame').src=current.frames[index];$('scrub').value=index;$('time').textContent=`เฟรม ${index+1} / ${current.frames.length} · ${frameTime(index).toFixed(3)} s`}
function tick(){show((index+1)%current.frames.length);timer=setTimeout(tick,1000*(index+1<current.frames.length?frameTime(index+1)-frameTime(index):1/current.fps)/Number($('speed').value))}
function select(){stop();current=sets.find(s=>s.id===$('set').value);$('scrub').max=current.frames.length-1;$('target').src=current.target||'target.png';$('reference-label').textContent=current.referenceLabel||'ภาพอ้างอิง';$('note').textContent=current.note||'ภาพแยกเอฟเฟกต์ ใช้ความชันกล้องเกมและซูมเพื่อดูรายละเอียด ยังไม่ใช่ภาพเต็มฉากจากเครื่องผู้เล่น';show(0);$('poses').replaceChildren();for(const t of (current.poses??(current.id==='atlas'?[.02,.10,.20,.34,.65,1.40]:[.21,.46,.54,.71,.96,1.83]))){const n=(current.times?current.times.reduce((best,v,i)=>Math.abs(v-t)<Math.abs(current.times[best]-t)?i:best,0):Math.min(current.frames.length-1,Math.round(t*current.fps))),b=document.createElement('button'),im=document.createElement('img');im.src=current.frames[n];im.alt=`ดูเฟรม ${n+1}`;b.append(im,document.createTextNode(frameTime(n).toFixed(2)+' s'));b.onclick=()=>{stop();show(n)};$('poses').append(b)}$('status').textContent='พร้อมตรวจภาพ · เลื่อนเวลาเพื่อเทียบกับเรฟ';}
$('play').onclick=()=>{if(timer){stop()}else{$('play').textContent='หยุด';tick()}};$('prev').onclick=()=>{stop();show(index-1)};$('next').onclick=()=>{stop();show(index+1)};$('scrub').oninput=e=>{stop();show(+e.target.value)};$('set').onchange=select;
fetch('frames.json').then(r=>{if(!r.ok)throw Error('โหลดรายการภาพไม่ได้');return r.json()}).then(data=>{sets=data;for(const s of sets){const o=document.createElement('option');o.value=s.id;o.textContent=s.label;$('set').append(o)}$('set').value=new URLSearchParams(location.search).get('set')||'atlas';select()}).catch(e=>$('status').textContent=e.message);
</script></html>
