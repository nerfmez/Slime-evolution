<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thorn · ทดลองภาพเดิน 2D</title><style>body{margin:0;background:#eeeadc;color:#303c35;font:16px system-ui}main{max-width:1000px;margin:auto;padding:20px}header,.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,a{font:inherit;padding:12px;background:#fffdf4;color:inherit;border:1px solid #a2ac99;border-radius:10px}canvas{display:block;width:min(100%,512px);height:auto;background:#b8c78f;border-radius:12px;margin:16px auto}input{width:100%;min-height:44px}p{line-height:1.6}img{max-width:100%}</style><main><header><h1>Thorn · ภาพเดิน 2D</h1><a href="/">กลับเกม</a><a href="index.html">ตรวจเอฟเฟกต์</a><a href="slime.html">ลองสไลม์วาด 2D</a></header><p>ภาพจากโมเดลเดิม 8 ทิศ · เทียบ 32 / 24 / 16 เฟรม · จุดยืนเดียวกันทุกเฟรม</p><div class="controls"><label>เฟรมต่อรอบ <select id="count" aria-label="เฟรมต่อรอบ"><option value="32">32 เฟรม</option><option value="24">24 เฟรม</option><option value="16" selected>16 เฟรม</option></select></label><label>ทิศ <select id="direction" aria-label="ทิศ"><option value="0">หน้า</option><option value="1">เฉียง 45°</option><option value="2">ข้าง 90°</option><option value="3">เฉียง 135°</option><option value="4">หลัง</option><option value="5">เฉียง 225°</option><option value="6">ข้าง 270°</option><option value="7">เฉียง 315°</option></select></label><button id="play">หยุด</button><button id="step">1 เฟรม</button><label>ความเร็ว <select id="speed"><option value="1">เดินปกติ</option><option value=".25">ช้า ¼</option></select></label></div><canvas id="view" width="512" height="512" aria-label="ท่าเดิน Thorn จากภาพ 2D"></canvas><output id="time"></output><input id="frame" aria-label="เฟรมเดิน" type="range" min="0" max="31" value="0"><p>ในเกม เฟรมเดินสัมพันธ์กับระยะเคลื่อนที่จริง หน้านี้ขยายภาพเพื่อดูขาและการเปลี่ยนทิศ เปิดได้โดยไม่ใช้ WebGL</p><details><summary>ดูครบทุกทิศ</summary><img src="thorn-directions.png" alt="Thorn 8 ทิศและจังหวะขา 4 ช่วง"></details></main><script>
const $=id=>document.getElementById(id),ctx=$('view').getContext('2d'),img=new Image();let count=16,frame=0,playing=true,last=0,acc=0;img.src='../assets/enemies/thorn-sprite.png';
function draw(){ctx.clearRect(0,0,512,512);const cell=Number($('direction').value)*32+Math.round(frame*32/count)%32;ctx.drawImage(img,cell%16*128,Math.floor(cell/16)*128,128,128,0,0,512,512);$('time').textContent=`เฟรม ${frame+1} / ${count}`;$('frame').max=count-1;$('frame').value=frame;}
function stop(){playing=false;$('play').textContent='เล่น';}
img.onload=()=>{draw();requestAnimationFrame(tick)};function tick(t){if(last&&playing){acc+=(t-last)*Number($('speed').value);const step=1000*(.42/1.18)/count;while(acc>=step){frame=(frame+1)%count;acc-=step;}draw();}last=t;requestAnimationFrame(tick)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'หยุด':'เล่น';};$('step').onclick=()=>{stop();frame=(frame+1)%count;draw()};$('frame').oninput=e=>{stop();frame=Number(e.target.value);draw()};$('direction').onchange=draw;$('count').onchange=()=>{const phase=frame/count;count=Number($('count').value);frame=Math.min(count-1,Math.floor(phase*count));acc=0;draw();};
</script></html>
